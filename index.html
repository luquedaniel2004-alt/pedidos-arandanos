<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Arándanos</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .contenedor { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        canvas { border: 2px dashed #007bff; background-color: #fcfcfc; border-radius: 5px; cursor: crosshair; touch-action: none; }
        button { width: 100%; padding: 12px; margin-top: 15px; background: #007bff; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; }
        .btn-verde { background: #28a745; }
        .btn-rojo { background: #dc3545; margin-top: 5px; }
        #seccionPedido { display: none; } /* Oculto inicialmente */
        .nombre-empleado { font-size: 18px; font-weight: bold; color: #333; margin: 15px 0; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Pedido de Arándanos</h2>
    
    <!-- SECCIÓN 1: BÚSQUEDA -->
    <div id="seccionBusqueda">
        <input type="number" id="cedulaBusqueda" placeholder="Ingrese su Cédula" required>
        <button type="button" onclick="buscarEmpleado()" id="btnBuscar">Buscar</button>
    </div>

    <!-- SECCIÓN 2: PEDIDO Y FIRMA (Oculta hasta validar) -->
    <div id="seccionPedido">
        <div class="nombre-empleado" id="nombreMostrado"></div>
        
        <p style="font-size: 14px; color: #555;">Por seguridad, confirme su año de nacimiento:</p>
        <input type="number" id="validacionSeguridad" placeholder="Ej: 1990" required>
        
        <input type="number" id="cantidad" placeholder="Cantidad de cajas" required>
        
        <p>Firme dentro del recuadro:</p>
        <canvas id="pizarra" width="300" height="150"></canvas>
        <button type="button" class="btn-rojo" onclick="limpiarFirma()">Borrar Firma</button>
        <button type="button" class="btn-verde" onclick="validarYEnviar()" id="btnEnviar">Confirmar Pedido</button>
    </div>
</div>

<script>
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbxx7v0p5Cv8Ej_sVqo4uKhrwauKMjm9NNZSEWsz1Wy9eYZV57EXG4UgRiGFB39tLMKFig/exec"; // <--- REEMPLAZA ESTO
    let datoSeguridadReal = "";
    let nombreReal = "";

    // Lógica del lienzo de dibujo
    const canvas = document.getElementById("pizarra");
    const ctx = canvas.getContext("2d");
    let pintando = false;

    function obtenerPosicion(e) {
        const rect = canvas.getBoundingClientRect();
        const clienteX = e.clientX || (e.touches && e.touches[0].clientX);
        const clienteY = e.clientY || (e.touches && e.touches[0].clientY);
        return { x: clienteX - rect.left, y: clienteY - rect.top };
    }

    function iniciarDibujo(e) { pintando = true; dibujar(e); e.preventDefault(); }
    function detenerDibujo(e) { pintando = false; ctx.beginPath(); e.preventDefault(); }
    function dibujar(e) {
        if (!pintando) return;
        const pos = obtenerPosicion(e);
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    canvas.addEventListener("mousedown", iniciarDibujo);
    canvas.addEventListener("mouseup", detenerDibujo);
    canvas.addEventListener("mousemove", dibujar);
    canvas.addEventListener("touchstart", iniciarDibujo, {passive: false});
    canvas.addEventListener("touchend", detenerDibujo, {passive: false});
    canvas.addEventListener("touchmove", dibujar, {passive: false});

    function limpiarFirma() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // Función 1: Buscar la cédula en la base de datos
    function buscarEmpleado() {
        const cedula = document.getElementById("cedulaBusqueda").value;
        if (!cedula) { alert("Ingrese una cédula"); return; }

        const btn = document.getElementById("btnBuscar");
        btn.innerText = "Buscando..."; btn.disabled = true;

        const datos = { accion: "buscar", cedula: cedula };

        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            body: JSON.stringify(datos),
            headers: { "Content-Type": "text/plain;charset=utf-8" } // Evita errores de CORS
        })
        .then(res => res.json())
        .then(respuesta => {
            if (respuesta.encontrado) {
                nombreReal = respuesta.nombre;
                datoSeguridadReal = respuesta.datoSeguridad;
                
                document.getElementById("seccionBusqueda").style.display = "none";
                document.getElementById("seccionPedido").style.display = "block";
                document.getElementById("nombreMostrado").innerText = "Hola, " + nombreReal;
            } else {
                alert("Cédula no encontrada en el sistema.");
            }
            btn.innerText = "Buscar"; btn.disabled = false;
        })
        .catch(error => {
            alert("Error de conexión.");
            btn.innerText = "Buscar"; btn.disabled = false;
        });
    }

    // Función 2: Validar seguridad y enviar el pedido
    function validarYEnviar() {
        const validacionUsuario = document.getElementById("validacionSeguridad").value;
        const cantidad = document.getElementById("cantidad").value;
        const cedula = document.getElementById("cedulaBusqueda").value;
        
        if (!validacionUsuario || !cantidad) { alert("Llene todos los campos"); return; }
        
        // Verificación antisuplantación
        if (validacionUsuario.toString() !== datoSeguridadReal.toString()) {
            alert("El dato de seguridad no coincide. Pedido bloqueado.");
            return;
        }

        const btn = document.getElementById("btnEnviar");
        btn.innerText = "Enviando..."; btn.disabled = true;

        const firmaBase64 = canvas.toDataURL("image/png");
        const datos = { accion: "guardar", cedula: cedula, nombre: nombreReal, cantidad: cantidad, firma: firmaBase64 };

        fetch(URL_GOOGLE_SCRIPT, {
            method: "POST",
            body: JSON.stringify(datos),
            headers: { "Content-Type": "text/plain;charset=utf-8" }
        })
        .then(res => res.json())
        .then(respuesta => {
            alert("¡Pedido validado y enviado con éxito!");
            // Reiniciar formulario
            document.location.reload(); 
        })
        .catch(error => {
            alert("Hubo un error al guardar.");
            btn.innerText = "Confirmar Pedido"; btn.disabled = false;
        });
    }
</script>
</body>
</html>
