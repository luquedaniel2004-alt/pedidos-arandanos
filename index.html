<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema General - Flores de Funza</title>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #eef2f3; 
            background-image: url('https://lh3.googleusercontent.com/d/1hiXn-HopXnr5Hr0mVByV4RDtIjwNUi_Q=s800');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover; 
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 500px; 
            background: rgba(255, 255, 255, 0.96); 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
            margin: auto; 
        }

        .logo-superior {
            text-align: center;
            margin-bottom: 10px;
        }
        .logo-superior img {
            max-width: 130px;
            height: auto;
        }

        h2, h3 { text-align: center; color: #2c3e50; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif; }
        button { background-color: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .btn-secondary { background-color: #007bff; }
        .btn-secondary:hover { background-color: #0056b3; }
        .btn-warning { background-color: #e67e22; color: white; }
        .btn-warning:hover { background-color: #d35400; }
        .btn-purple { background-color: #6f42c1; color: white; }
        .btn-purple:hover { background-color: #5a32a3; }
        .btn-danger { background-color: #dc3545; margin-top: 5px; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-volver { background-color: #6c757d; margin-top: 10px; }
        .btn-volver:hover { background-color: #5a6268; }
        .alerta-offline { background-color: #d1ecf1; color: #0c5460; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; margin-bottom: 15px; border: 1px solid #bee5eb; }
        
        .vista { display: none; }
        .vista.activa { display: block; }
        
        #signature-pad { border: 2px dashed #ccc; background-color: #fafafa; width: 100%; height: 200px; border-radius: 4px; }
        .mensaje-autorizacion { background-color: #fff3cd; color: #856404; padding: 12px; border-radius: 4px; font-weight: bold; text-align: center; margin-bottom: 15px; border: 1px solid #ffeeba; }
        .bienvenida-box { text-align: center; padding: 10px 0; }
        .bienvenida-box p { color: #666; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-superior">
        <img src="https://lh3.googleusercontent.com/d/1RHICmfq1ahAcpbFM8EzGTKpx_lay6Zk0=s800" alt="Logo Flores de Funza">
    </div>

    <h2>Flores de Funza</h2>

    <!-- PANTALLA DE INICIO -->
    <div id="vistaInicio" class="vista activa">
        <div class="bienvenida-box">
            <h3>Bienvenido</h3>
            <p>Por favor, seleccione el módulo al que desea ingresar:</p>
            <button class="btn-secondary" onclick="irAModulo('arandanos')">🫐 Pedido de Arándanos</button>
            <button class="btn-warning" onclick="irAModulo('postcosecha')">📦 Ingreso a Postcosecha</button>
            <button class="btn-purple" onclick="irAModulo('rendimiento')">🌱 Rendimiento de Cultivo</button>
        </div>
    </div>

    <!-- MÓDULO ARÁNDANOS -->
    <div id="vistaArandanos" class="vista">
        <h3>Módulo de Arándanos</h3>
        
        <div id="seccionValidacion">
            <div class="form-group">
                <label>Cédula:</label>
                <input type="text" id="inputCedula" placeholder="Ingrese su cédula">
            </div>
            <div class="form-group">
                <label>Año de Seguridad:</label>
                <input type="text" id="inputSeguridad" placeholder="Año de seguridad">
            </div>
            <button id="btnValidar" class="btn-secondary" onclick="verificarEmpleado()">Validar Empleado</button>
        </div>

        <div id="seccionProductos" style="display:none;">
            <p id="saludoEmpleado" style="font-weight: bold; color: #007bff; text-align: center; font-size: 16px;"></p>
            
            <div class="form-group">
                <label>Promoción 3 Kilos ($20.000 c/u):</label>
                <input type="number" id="inputPromoKilos" min="0" value="0">
            </div>
            <div class="form-group">
                <label>1 Kilo Regular ($29.000 c/u):</label>
                <input type="number" id="inputKiloNormal" min="0" value="0">
            </div>
            <div class="form-group">
                <label>Mermeladas ($15.000 c/u):</label>
                <input type="number" id="inputMermeladas" min="0" value="0">
            </div>
            <div class="form-group">
                <label>Frambuesas ($18.000 c/u):</label>
                <input type="number" id="inputFrambuesas" min="0" value="0">
            </div>

            <button onclick="calcularPedidoYMostrarAutorizacion()">Continuar para Firmar</button>
        </div>

        <div id="seccionFirma" style="display:none;">
            <div id="mensajeAutorizacion" class="mensaje-autorizacion"></div>
            <label>Firma del Empleado:</label>
            <canvas id="signature-pad"></canvas>
            <button type="button" class="btn-danger" onclick="signaturePad.clear()">Borrar Firma</button>
            <button id="btnEnviarPedido" onclick="enviarPedidoArandanos()">Finalizar y Enviar Pedido</button>
            <button class="btn-volver" onclick="regresarAProductos()">Regresar y cambiar cantidades</button>
        </div>

        <button class="btn-volver" onclick="volverInicio()">Volver al Inicio</button>
    </div>

    <!-- MÓDULO POSTCOSECHA -->
    <div id="vistaPostcosecha" class="vista">
        <h3>Ingreso a Postcosecha</h3>
        <div class="form-group">
            <label>Fecha de Ingreso:</label>
            <input type="date" id="postFecha">
        </div>
        <div class="form-group">
            <label>Bloque:</label>
            <input type="text" id="postBloque" placeholder="Ej: Bloque A">
        </div>
        <div class="form-group">
            <label>Año de Bloque:</label>
            <input type="text" id="postAnio" placeholder="Ej: 2025">
        </div>
        <div class="form-group">
            <label>Número de Canastillas:</label>
            <input type="number" id="postCanastillas" placeholder="Cantidad">
        </div>
        <div class="form-group">
            <label>Peso Total de Canastillas (kg):</label>
            <input type="number" id="postPesoTotal" placeholder="Peso total">
        </div>
        <div class="form-group">
            <label>Peso de Canastilla (kg):</label>
            <input type="number" id="postPesoCanastilla" placeholder="Peso individual">
        </div>
        <div class="form-group">
            <label>Tipo de Fruta:</label>
            <select id="postFruta">
                <option value="Tipo 1">Tipo 1</option>
                <option value="Tipo 2">Tipo 2</option>
                <option value="Tipo 3">Tipo 3</option>
            </select>
        </div>
        <div class="form-group">
            <label>Variedad:</label>
            <select id="postVariedad">
                <option value="BILOXI">BILOXI</option>
                <option value="SHARPBLU">SHARPBLU</option>
                <option value="EMERALD">EMERALD</option>
                <option value="VICTORIA">VICTORIA</option>
                <option value="LEGACY">LEGACY</option>
                <option value="RIBBON">RIBBON</option>
                <option value="VENTURA">VENTURA</option>
                <option value="ATLAS">ATLAS</option>
                <option value="BIANCA">BIANCA</option>
            </select>
        </div>
        <button id="btnGuardarPost" class="btn-warning" onclick="enviarPostcosecha()">Guardar Ingreso Postcosecha</button>
        <button class="btn-volver" onclick="volverInicio()">Volver al Inicio</button>
    </div>

    <!-- MÓDULO RENDIMIENTO DE CULTIVO -->
    <div id="vistaRendimiento" class="vista">
        <h3>Rendimiento por Paradas</h3>
        
        <div id="seccionPinRendimiento">
            <div class="form-group">
                <label>PIN de Seguridad Autorizado:</label>
                <input type="password" id="inputPinRend" placeholder="Ingrese el PIN">
            </div>
            <button class="btn-purple" onclick="verificarPinRendimiento()">Ingresar al Módulo</button>
            <button class="btn-volver" onclick="volverInicio()">Volver al Inicio</button>
        </div>

        <div id="seccionFormRendimiento" style="display:none;">
            <div id="alertaPendientes" class="alerta-offline" style="display:none;"></div>
            
            <div class="form-group">
                <label>Fecha de Labor:</label>
                <input type="date" id="rendFecha">
            </div>
            
            <div class="form-group">
                <label>Seleccionar Parada (Horario):</label>
                <select id="rendSelectParada">
                    <option value="">-- Seleccione la parada --</option>
                    <option value="1ª Parada (06:05 a 08:00)">1ª Parada (06:05 a 08:00)</option>
                    <option value="2ª Parada (08:00 a 10:00)">2ª Parada (08:00 a 10:00)</option>
                    <option value="3ª Parada (10:00 a 12:00)">3ª Parada (10:00 a 12:00)</option>
                    <option value="4ª Parada (12:30 a 01:40)">4ª Parada (12:30 a 01:40)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Seleccionar Grupo:</label>
                <select id="rendSelectGrupo" onchange="filtrarPersonalPorGrupo()">
                    <option value="">-- Seleccione un grupo --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Seleccionar Trabajador:</label>
                <select id="rendSelectEmpleado">
                    <option value="">-- Primero seleccione un grupo --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Bloque:</label>
                <input type="text" id="rendBloque" placeholder="Ej: Bloque A">
            </div>

            <div class="form-group">
                <label>Baldes Tipo 1:</label>
                <input type="number" id="rendValdesT1" min="0" value="0" placeholder="Ej: 4">
            </div>
            <div class="form-group">
                <label>Baldes Tipo 2:</label>
                <input type="number" id="rendValdesT2" min="0" value="0" placeholder="Ej: 2">
            </div>
            <div class="form-group">
                <label>Baldes Tipo 3:</label>
                <input type="number" id="rendValdesT3" min="0" value="0" placeholder="Ej: 1">
            </div>

            <div class="form-group">
                <label>Observaciones (Opcional):</label>
                <textarea id="rendObservaciones" rows="2" placeholder="Escriba aquí cualquier novedad o nota..."></textarea>
            </div>
            
            <button id="btnGuardarRend" class="btn-purple" onclick="enviarRendimiento()">Guardar Rendimiento de Parada</button>
            <button id="btnSincronizar" class="btn-secondary" style="display:none; background-color: #17a2b8;" onclick="sincronizarPendientes()">🔄 Sincronizar Registros Pendientes</button>
            <button class="btn-volver" onclick="volverInicio()">Volver al Inicio</button>
        </div>
    </div>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxx7v0p5Cv8Ej_sVqo4uKhrwauKMjm9NNZSEWsz1Wy9eYZV57EXG4UgRiGFB39tLMKFig/exec";
    let nombreEmpleadoGlobal = "";
    let listaPersonalGlobal = [];
    let canvas = document.getElementById('signature-pad');
    let signaturePad = new SignaturePad(canvas);
    let datosPedidoActual = {};

    window.addEventListener('DOMContentLoaded', () => {
        let hoy = new Date().toISOString().split('T')[0];
        if (document.getElementById('postFecha')) document.getElementById('postFecha').value = hoy;
        if (document.getElementById('rendFecha')) document.getElementById('rendFecha').value = hoy;
        
        cargarDatosRendimiento();
    });

    function irAModulo(modulo) {
        document.getElementById('vistaInicio').classList.remove('activa');
        document.getElementById('vistaArandanos').classList.remove('activa');
        document.getElementById('vistaPostcosecha').classList.remove('activa');
        document.getElementById('vistaRendimiento').classList.remove('activa');

        if (modulo === 'arandanos') {
            document.getElementById('vistaArandanos').classList.add('activa');
        } else if (modulo === 'postcosecha') {
            document.getElementById('vistaPostcosecha').classList.add('activa');
        } else if (modulo === 'rendimiento') {
            document.getElementById('vistaRendimiento').classList.add('activa');
            document.getElementById('seccionPinRendimiento').style.display = 'block';
            document.getElementById('seccionFormRendimiento').style.display = 'none';
            document.getElementById('inputPinRend').value = '';
        }
    }

    function volverInicio() { location.reload(); }

    function resizeCanvas() {
        let ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext("2d").scale(ratio, ratio);
        signaturePad.clear();
    }

    function verificarPinRendimiento() {
        let pin = document.getElementById('inputPinRend').value.trim();
        if (pin === "2005") {
            document.getElementById('seccionPinRendimiento').style.display = 'none';
            document.getElementById('seccionFormRendimiento').style.display = 'block';
            actualizarAlertaOffline();
        } else {
            alert("PIN de seguridad incorrecto.");
        }
    }

    function cargarDatosRendimiento() {
        fetch(`${URL_SCRIPT}?accion=obtener_personal_cosecha`)
            .then(res => res.json())
            .then(data => {
                if (data.personal && data.personal.length > 0) {
                    listaPersonalGlobal = data.personal;
                    let gruposUnicos = [...new Set(listaPersonalGlobal.map(item => item.grupo))];
                    let selectGrupo = document.getElementById('rendSelectGrupo');
                    selectGrupo.innerHTML = '<option value="">-- Seleccione un grupo --</option>';
                    
                    gruposUnicos.forEach(grupo => {
                        let opt = document.createElement('option');
                        opt.value = grupo;
                        opt.textContent = grupo;
                        selectGrupo.appendChild(opt);
                    });
                }
            })
            .catch(err => {
                console.log("Sin internet para actualizar personal. Usando memoria local si existe.");
            });
    }

    function filtrarPersonalPorGrupo() {
        let grupoSeleccionado = document.getElementById('rendSelectGrupo').value;
        let selectEmpleado = document.getElementById('rendSelectEmpleado');
        selectEmpleado.innerHTML = '<option value="">-- Seleccione un trabajador --</option>';
        
        if (!grupoSeleccionado) return;

        let filtrados = listaPersonalGlobal.filter(item => item.grupo === grupoSeleccionado);
        filtrados.forEach(emp => {
            let opt = document.createElement('option');
            opt.value = emp.nombre;
            opt.textContent = emp.nombre;
            selectEmpleado.appendChild(opt);
        });
    }

    function enviarRendimiento() {
        let fecha = document.getElementById('rendFecha').value;
        let parada = document.getElementById('rendSelectParada').value;
        let grupo = document.getElementById('rendSelectGrupo').value;
        let nombre = document.getElementById('rendSelectEmpleado').value;
        let bloque = document.getElementById('rendBloque').value.trim();
        
        let valdesT1 = parseInt(document.getElementById('rendValdesT1').value) || 0;
        let valdesT2 = parseInt(document.getElementById('rendValdesT2').value) || 0;
        let valdesT3 = parseInt(document.getElementById('rendValdesT3').value) || 0;
        let observaciones = document.getElementById('rendObservaciones').value.trim();

        if (!fecha || !parada || !grupo || !nombre || !bloque) {
            alert("Por favor, complete los datos obligatorios (Fecha, Parada, Grupo, Trabajador y Bloque).");
            return;
        }

        if (valdesT1 === 0 && valdesT2 === 0 && valdesT3 === 0) {
            alert("Debe ingresar al menos la cantidad de Baldes en algún tipo de fruta.");
            return;
        }

        let horaRealActual = new Date().toLocaleTimeString();

        let nuevoDato = {
            accion: "guardar_rendimiento",
            fechaRegistro: fecha,
            parada: parada,
            horaReal: horaRealActual,
            grupo: grupo,
            nombre: nombre,
            bloque: bloque,
            valdesT1: valdesT1,
            valdesT2: valdesT2,
            valdesT3: valdesT3,
            observaciones: observaciones
        };

        let btn = document.getElementById('btnGuardarRend');
        btn.innerText = "Guardando...";
        btn.disabled = true;

        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(nuevoDato) })
            .then(() => {
                btn.innerText = "Guardar Rendimiento de Parada";
                btn.disabled = false;
                alert("¡Rendimiento guardado correctamente!");
                limpiarCamposRendimiento();
            })
            .catch(error => {
                console.warn("Sin conexión. Guardando localmente.", error);
                guardarLocalmente(nuevoDato);
            });
    }

    function guardarLocalmente(dato) {
        let pendientes = JSON.parse(localStorage.getItem('rendimientosPendientes')) || [];
        pendientes.push(dato);
        localStorage.setItem('rendimientosPendientes', JSON.stringify(pendientes));

        let btn = document.getElementById('btnGuardarRend');
        btn.innerText = "Guardar Rendimiento de Parada";
        btn.disabled = false;

        alert("⚠️ Sin conexión a internet. El rendimiento se guardó localmente en su dispositivo.");
        limpiarCamposRendimiento();
        actualizarAlertaOffline();
    }

    function limpiarCamposRendimiento() {
        document.getElementById('rendSelectEmpleado').innerHTML = '<option value="">-- Primero seleccione un grupo --</option>';
        document.getElementById('rendSelectGrupo').value = "";
        document.getElementById('rendBloque').value = "";
        document.getElementById('rendValdesT1').value = "0";
        document.getElementById('rendValdesT2').value = "0";
        document.getElementById('rendValdesT3').value = "0";
        document.getElementById('rendObservaciones').value = "";
    }

    function actualizarAlertaOffline() {
        let pendientes = JSON.parse(localStorage.getItem('rendimientosPendientes')) || [];
        let alerta = document.getElementById('alertaPendientes');
        let btnSync = document.getElementById('btnSincronizar');

        if (pendientes.length > 0) {
            alerta.style.display = 'block';
            alerta.innerText = `📦 Tiene ${pendientes.length} registros de paradas guardados sin sincronizar.`;
            btnSync.style.display = 'block';
        } else {
            alerta.style.display = 'none';
            btnSync.style.display = 'none';
        }
    }

    function sincronizarPendientes() {
        let pendientes = JSON.parse(localStorage.getItem('rendimientosPendientes')) || [];
        if (pendientes.length === 0) return;

        let btnSync = document.getElementById('btnSincronizar');
        btnSync.innerText = "Sincronizando...";
        btnSync.disabled = true;

        let payloadLote = {
            accion: "guardar_rendimiento_lote",
            lote: pendientes
        };

        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payloadLote) })
            .then(() => {
                localStorage.removeItem('rendimientosPendientes');
                btnSync.innerText = "🔄 Sincronizar Registros Pendientes";
                btnSync.disabled = false;
                alert("¡Sincronización exitosa! Todas las paradas pasaron a Google Sheets.");
                actualizarAlertaOffline();
            })
            .catch(err => {
                console.error("Error al sincronizar:", err);
                btnSync.innerText = "🔄 Sincronizar Registros Pendientes";
                btnSync.disabled = false;
                alert("Aún no hay conexión estable a internet.");
            });
    }

    // --- LÓGICA DE ARÁNDANOS Y POSTCOSECHA ---
    function verificarEmpleado() {
        let cedula = document.getElementById('inputCedula').value.trim();
        let seguridad = document.getElementById('inputSeguridad').value.trim();
        if (!cedula || !seguridad) { alert("Por favor, ingrese la cédula y el año de seguridad."); return; }

        let btn = document.getElementById('btnValidar');
        btn.innerText = "Buscando...";
        btn.disabled = true;

        fetch(`${URL_SCRIPT}?accion=buscar&cedula=${cedula}&seguridad=${seguridad}`)
            .then(res => res.json())
            .then(data => {
                btn.innerText = "Validar Empleado";
                btn.disabled = false;
                if (data.encontrado) {
                    nombreEmpleadoGlobal = data.nombre;
                    document.getElementById('saludoEmpleado').innerText = `Bienvenido(a): ${nombreEmpleadoGlobal}`;
                    document.getElementById('seccionValidacion').style.display = 'none';
                    document.getElementById('seccionProductos').style.display = 'block';
                } else {
                    alert("Cédula o año de seguridad incorrectos.");
                }
            })
            .catch(err => {
                console.error(err);
                btn.innerText = "Validar Empleado";
                btn.disabled = false;
                alert("Error de conexión.");
            });
    }

    function calcularPedidoYMostrarAutorizacion() {
        let promoKilos = parseInt(document.getElementById('inputPromoKilos').value) || 0;
        let kiloNormal = parseInt(document.getElementById('inputKiloNormal').value) || 0;
        let mermeladas = parseInt(document.getElementById('inputMermeladas').value) || 0;
        let frambuesas = parseInt(document.getElementById('inputFrambuesas').value) || 0;

        let totalPagar = (promoKilos * 20000) + (kiloNormal * 29000) + (mermeladas * 15000) + (frambuesas * 18000);
        if (totalPagar === 0) { alert("Debe seleccionar al menos un producto."); return; }

        let detalle = [];
        if (promoKilos > 0) detalle.push(`${promoKilos} Promo 3kg`);
        if (kiloNormal > 0) detalle.push(`${kiloNormal} Kilo regular`);
        if (mermeladas > 0) detalle.push(`${mermeladas} Mermelada(s)`);
        if (frambuesas > 0) detalle.push(`${frambuesas} Kilo frambuesa`);

        let textoDetalleFinal = detalle.join(" + ");
        datosPedidoActual = { detallePedido: textoDetalleFinal, totalPagar: totalPagar };

        document.getElementById('mensajeAutorizacion').innerText = 
            `Firme si autoriza el descuento de: $${totalPagar.toLocaleString()} pesos (${textoDetalleFinal}).`;

        document.getElementById('seccionProductos').style.display = 'none';
        document.getElementById('seccionFirma').style.display = 'block';
        resizeCanvas();
    }

    function regresarAProductos() {
        document.getElementById('seccionFirma').style.display = 'none';
        document.getElementById('seccionProductos').style.display = 'block';
    }

    function enviarPedidoArandanos() {
        if (signaturePad.isEmpty()) { alert("Por favor, realice la firma antes de enviar."); return; }

        let btn = document.getElementById('btnEnviarPedido');
        btn.innerText = "Enviando...";
        btn.disabled = true;

        let payload = {
            accion: "guardar_arandanos",
            cedula: document.getElementById('inputCedula').value.trim(),
            nombre: nombreEmpleadoGlobal,
            detallePedido: datosPedidoActual.detallePedido,
            totalPagar: datosPedidoActual.totalPagar,
            firma: signaturePad.toDataURL("image/png")
        };

        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
            .then(() => { 
                alert("¡Pedido registrado con éxito!"); 
                location.reload(); 
            })
            .catch(err => {
                btn.innerText = "Finalizar y Enviar Pedido";
                btn.disabled = false;
                alert("Error de conexión.");
            });
    }

    function enviarPostcosecha() {
        let fecha = document.getElementById('postFecha').value;
        let bloque = document.getElementById('postBloque').value.trim();
        let anio = document.getElementById('postAnio').value.trim();
        let canastillas = document.getElementById('postCanastillas').value.trim();
        let pesoTotal = document.getElementById('postPesoTotal').value.trim();
        let pesoCanastilla = document.getElementById('postPesoCanastilla').value.trim();

        if (!fecha || !bloque || !anio || !canastillas || !pesoTotal || !pesoCanastilla) {
            alert("Por favor, complete todos los campos.");
            return;
        }

        let btn = document.getElementById('btnGuardarPost');
        btn.innerText = "Guardando...";
        btn.disabled = true;

        let payload = {
            accion: "guardar_postcosecha",
            fechaRegistro: fecha,
            bloque: bloque,
            anioBloque: anio,
            canastillas: canastillas,
            pesoTotal: pesoTotal,
            pesoCanastilla: pesoCanastilla,
            tipoFruta: document.getElementById('postFruta').value,
            variedad: document.getElementById('postVariedad').value
        };

        fetch(URL_SCRIPT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })
            .then(() => { 
                alert("¡Ingreso a postcosecha guardado correctamente!"); 
                location.reload(); 
            })
            .catch(error => {
                btn.innerText = "Guardar Ingreso Postcosecha";
                btn.disabled = false;
                alert("Error de conexión.");
            });
    }
</script>
