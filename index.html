<script>
    const URL_DEL_SCRIPT = "TU_URL_DE_APPS_SCRIPT_AQUI";
    let nombreGlobal = "";
    let enviando = false;

    function mostrarSeccion(seccion) {
        document.getElementById('menu-principal').classList.add('hidden');
        if(seccion === 'arandanos') {
            document.getElementById('seccion-arandanos').classList.remove('hidden');
            inicializarCanvas();
        } else {
            document.getElementById('seccion-postcosecha').classList.remove('hidden');
        }
    }

    function volverMenu() {
        document.getElementById('seccion-arandanos').classList.add('hidden');
        document.getElementById('seccion-postcosecha').classList.add('hidden');
        document.getElementById('menu-principal').classList.remove('hidden');
        document.getElementById('paso1-aran').classList.remove('hidden');
        document.getElementById('paso2-aran').classList.add('hidden');
        document.getElementById('cedula-aran').value = "";
        document.getElementById('seguridad-aran').value = "";
        document.getElementById('cantidad-aran').value = "";
        document.getElementById('codigo-post').value = "";
        document.getElementById('bloque').value = "";
        document.getElementById('anio-bloque').value = "";
        document.getElementById('canastillas').value = "";
        document.getElementById('peso').value = "";
        limpiarFirma();
    }

    function verificarEmpleado() {
        const cedula = document.getElementById('cedula-aran').value;
        const seguridad = document.getElementById('seguridad-aran').value;

        if(!cedula || !seguridad) {
            alert("Por favor completa ambos campos.");
            return;
        }

        fetch(URL_DEL_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ accion: "buscar", cedula: cedula })
        });

        nombreGlobal = "Empleado Autorizado";
        document.getElementById('nombre-empleado-aran').innerText = "Bienvenido: " + nombreGlobal;
        document.getElementById('paso1-aran').classList.add('hidden');
        document.getElementById('paso2-aran').classList.remove('hidden');
    }

    // --- LÓGICA DE FIRMA ---
    const canvas = document.getElementById('pizarra');
    const ctx = canvas.getContext('2d');
    let dibujando = false;

    function inicializarCanvas() {
        setTimeout(() => {
            canvas.width = canvas.offsetWidth;
            canvas.height = 150;
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
        }, 200);
    }

    canvas.addEventListener('mousedown', () => dibujando = true);
    canvas.addEventListener('mouseup', () => { dibujando = false; ctx.beginPath(); });
    canvas.addEventListener('mousemove', dibujar);

    canvas.addEventListener('touchstart', (e) => { dibujando = true; e.preventDefault(); });
    canvas.addEventListener('touchend', () => { dibujando = false; ctx.beginPath(); });
    canvas.addEventListener('touchmove', (e) => {
        if (!dibujando) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
        e.preventDefault();
    });

    function dibujar(e) {
        if (!dibujando) return;
        const rect = canvas.getBoundingClientRect();
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function limpiarFirma() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
    }

    // --- ENVÍOS CORREGIDOS (CIERRE LIMPIO DEL LOADER) ---
    function enviarArandanos() {
        if (enviando) return;

        const cedula = document.getElementById('cedula-aran').value;
        const cantidad = document.getElementById('cantidad-aran').value;
        const firmaData = canvas.toDataURL("image/png");

        if(!cantidad) { alert("Ingresa la cantidad de cajas"); return; }

        enviando = true;
        document.getElementById('btn-enviar-aran').disabled = true;
        document.getElementById('loader-texto').innerText = "Guardando pedido de arándanos...";
        document.getElementById('loader-overlay').classList.remove('hidden');

        const datos = {
            accion: "guardar_arandanos",
            cedula: cedula,
            nombre: nombreGlobal,
            cantidad: cantidad,
            firma: firmaData
        };

        setTimeout(() => {
            fetch(URL_DEL_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(datos)
            }).then(() => {
                document.getElementById('loader-overlay').classList.add('hidden'); // Oculta el fondo negro
                alert("¡Pedido de arándanos guardado con éxito!");
                location.reload();
            }).catch(() => {
                document.getElementById('loader-overlay').classList.add('hidden');
                document.getElementById('btn-enviar-aran').disabled = false;
                enviando = false;
                alert("Ocurrió un error al enviar.");
            });
        }, 400);
    }

    function enviarPostcosecha() {
        if (enviando) return;

        const codigo = document.getElementById('codigo-post').value;
        const bloque = document.getElementById('bloque').value;
        const anioBloque = document.getElementById('anio-bloque').value;
        const canastillas = document.getElementById('canastillas').value;
        const peso = document.getElementById('peso').value;

        if(codigo !== "2005") {
            alert("❌ Código de acceso incorrecto. No se puede registrar.");
            return;
        }

        if(!bloque || !anioBloque || !canastillas || !peso) { 
            alert("Completa todos los campos obligatorios"); 
            return; 
        }

        enviando = true;
        document.getElementById('btn-enviar-post').disabled = true;
        document.getElementById('loader-texto').innerText = "Registrando ingreso de fruta...";
        document.getElementById('loader-overlay').classList.remove('hidden');

        const datos = {
            accion: "guardar_postcosecha",
            codigo: codigo,
            bloque: bloque,
            anioBloque: anioBloque,
            canastillas: canastillas,
            peso: peso
        };

        setTimeout(() => {
            fetch(URL_DEL_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(datos)
            }).then(() => {
                document.getElementById('loader-overlay').classList.add('hidden'); // Oculta el fondo negro
                alert("¡Ingreso de fruta registrado con éxito en Postcosecha!");
                location.reload();
            }).catch(() => {
                document.getElementById('loader-overlay').classList.add('hidden');
                document.getElementById('btn-enviar-post').disabled = false;
                enviando = false;
                alert("Ocurrió un error al enviar.");
            });
        }, 400);
    }
</script>
